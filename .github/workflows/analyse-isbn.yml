name: Analyser la file ISBN

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Nombre maximal d’images à analyser
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: analyse-isbn
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Créer un jeton de la GitHub App Trinketa
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TRINKETA_APP_ID }}
          private-key: ${{ secrets.TRINKETA_APP_PRIVATE_KEY }}

      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-isbn.txt

      - name: Installer le lecteur de codes-barres
        run: sudo apt-get update && sudo apt-get install --yes libzbar0

      - name: Installer les dépendances
        run: python -m pip install -r requirements-isbn.txt

      - name: Analyser la file
        run: python scripts/analyze_isbn_queue.py --limit "${{ inputs.limit }}"

      - name: Vérifier si une proposition a été produite
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Créer la branche de proposition
        if: steps.changes.outputs.found == 'true'
        env:
          BRANCH_NAME: isbn-analysis/run-${{ github.run_id }}
        run: |
          git config user.name "trinketa-isbn[bot]"
          git config user.email "trinketa-isbn[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add data/bibliotheque_pipeline.json data/bibliotheque/imports photos/bibliotheque/isbn
          git commit -m "ISBN : proposer l’analyse de la file"
          git push origin "$BRANCH_NAME"

      - name: Ouvrir la pull request de validation
        if: steps.changes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: isbn-analysis/run-${{ github.run_id }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "ISBN : valider l’analyse de la file" \
            --body $'Le traitement automatisé a lu les codes-barres et interrogé les sources bibliographiques configurées.\n\nLa pull request contient les notices proposées, le journal, le rapport de contrôle et le déplacement des images vers `traite/` ou `a_verifier/`. Sa fusion constitue la validation humaine.'

      - name: Résultat sans modification
        if: steps.changes.outputs.found == 'false'
        run: echo "Aucune image exploitable n’était présente dans la file."
