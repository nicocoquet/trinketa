name: Publier le catalogue

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Si plusieurs commits arrivent rapidement, seul le déploiement le plus récent
# doit continuer. Les vérifications des autres branches restent indépendantes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt -r requirements-isbn.txt -r service/requirements.txt

      - name: Vérifier le code du dépôt ISBN
        run: |
          python -m py_compile scripts/*.py service/*.py
          python -m unittest discover -s tests

      - name: Intégrer les notices du pipeline ISBN
        run: python scripts/apply_bibliotheque_pipeline.py

      - name: Générer le catalogue mobilier
        run: python scripts/generate_mobilier.py

      - name: Générer la bibliothèque
        run: python scripts/generate_bibliotheque.py

      - name: Vérifier la construction du site
        run: mkdocs build --strict

      - name: Configurer Git
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publier sur GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
