site_name: Trinketa
site_url: https://nicocoquet.github.io/trinketa/
site_description: Catalogue illustré du mobilier et des livres anciens
site_author: Nicolas Coquet
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fr
  logo: assets/images/favicon.png
  favicon: assets/images/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Mode sombre / Dark / Scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Mode clair / Light / Chiaro

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Inventaire: Inventory
            Bibliothèque: Library
            Statistiques: Statistics
            Contact: Contact
          theme:
            language: en
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Accueil: Home
            Inventaire: Inventario
            Bibliothèque: Biblioteca
            Statistiques: Statistiche
            Contact: Contatto
          theme:
            language: it
  - search:
      lang:
        - fr
        - en
        - it

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - stylesheets/extra.css
  - stylesheets/bibliotheque.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - javascripts/catalogue-filters.js
  - javascripts/bibliotheque-statistiques.js
  - javascripts/contact-form.js
  - javascripts/isbn-deposit-config.js
  - javascripts/isbn-deposit.js

nav:
  - Accueil: index.md
  - Inventaire: inventario/index.md
  - Bibliothèque: biblioteca/index.md
  - Statistiques: statistiche.md
  - Contact: contatto.md

